; SpinLite - compilazione con PlatformIO.
;   pio run                      versione base (solo Bluetooth)
;   pio run -e spinlite_oled     con display OLED 128x32
;   pio run -t upload            compila e carica
;   pio device monitor           console seriale (115200)

[platformio]
src_dir = firmware/spinlite
default_envs = spinlite

[env]
; pioarduino: core Arduino-ESP32 3.3.12, ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:spinlite]

[env:spinlite_oled]
build_flags =
  ${env.build_flags}
  -DSPINLITE_OLED=1
