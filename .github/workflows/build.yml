name: Compilazione

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Test su PC (g++ con ASan/UBSan, vedi test/Makefile)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C test
      # parser della dashboard web
      - run: node docs/protocol.test.mjs

  # Compilazione con PlatformIO + immagini unite (artifact "firmware")
  firmware:
    uses: ./.github/workflows/_firmware.yml

  # Solo sui tag v*: Release con i .bin
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
